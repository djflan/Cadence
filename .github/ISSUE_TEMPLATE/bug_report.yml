name: Bug report
description: Something in Bluestone does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Attach a `.bluestone` or `.mid` file if it helps, as long as you may share it.
      placeholder: |
        1. Open ...
        2. Route track 1 to ...
        3. Press Play
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and CPU architecture
      placeholder: macOS 26.1, Apple Silicon
  - type: input
    id: commit
    attributes:
      label: Bluestone version or commit
      placeholder: 822d257
  - type: textarea
    id: midi-setup
    attributes:
      label: MIDI setup
      description: Device profile, MIDI endpoint, and hardware or software instrument involved.
      placeholder: Generic XG profile -> physical QY100 over USB MIDI interface
  - type: textarea
    id: logs
    attributes:
      label: Logs, MIDI monitor output, or screenshots
      render: text
